name: Release

# Tag a commit on main and the packages build themselves:
#   git tag v1.0.0 && git push origin v1.0.0
# Can also be run by hand from the Actions tab to rehearse a release without tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 1.0.0)"
        required: true
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The tests are the gate: a tag that doesn't pass them doesn't become a release.
      - name: Test
        run: dotnet test --configuration Release --logger "console;verbosity=minimal"

      - name: Publish
        run: |
          dotnet publish src/MyBudget.Desktop \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:Version=${{ steps.v.outputs.version }} \
            -p:InformationalVersion=${{ steps.v.outputs.version }} \
            --output publish

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin libfuse2
          # nfpm writes deb, rpm and Arch packages itself: one pinned static binary, no Ruby and no
          # bsdtar shell-out, which is what made fpm's pacman target fail.
          NFPM_VERSION=2.47.0
          curl -sSLf "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -o /tmp/nfpm.tar.gz
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version
          # AppImageKit is retired — its v13 assets were renamed "obsolete-*", which is why a pin
          # there 404s. appimagetool lives in its own repo now; pinned rather than "continuous".
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build packages
        # appimagetool wants FUSE; extracting it sidesteps that on a runner.
        run: |
          cd /usr/local/bin && sudo ./appimagetool --appimage-extract >/dev/null && sudo mv squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          cd "$GITHUB_WORKSPACE"
          packaging/build-packages.sh "${{ steps.v.outputs.version }}" publish dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.v.outputs.version }}
          path: dist/*

      # The version's section of CHANGELOG.md goes at the top of the release, above the install
      # table. A tag with no section there is a release nobody wrote notes for, so it stops here.
      - name: Release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
            fi
            echo "::warning::CHANGELOG.md has no section for $VERSION"
          fi
          cat >> release-notes.md <<'NOTES'

          ---

          Linux packages for MyBudget ${VERSION}.

          | File | Install |
          | --- | --- |
          | `MyBudget-${VERSION}-x86_64.AppImage` | `chmod +x` and run it. No installation. |
          | `mybudget_${VERSION}_amd64.deb` | `sudo apt install ./mybudget_${VERSION}_amd64.deb` |
          | `mybudget-${VERSION}-1.x86_64.rpm` | `sudo dnf install ./mybudget-${VERSION}-1.x86_64.rpm` |
          | `mybudget-${VERSION}-1-x86_64.pkg.tar.zst` | `sudo pacman -U ./mybudget-${VERSION}-1-x86_64.pkg.tar.zst` |

          The packages pull in WebKitGTK, which the window needs. The AppImage expects it to be
          installed already.

          ### Open-source libraries

          Built on these, each under its own licence:

          | Library | Licence | Used for |
          | --- | --- | --- |
          | [ASP.NET Core and Blazor](https://asp.net/) | MIT | The UI and the API |
          | [Entity Framework Core](https://docs.microsoft.com/ef/core/) | MIT | Data access and migrations |
          | [SQLitePCLRaw](https://github.com/ericsink/SQLitePCL.raw) | Apache-2.0 | The bundled SQLite engine, itself public domain |
          | [Photino](https://github.com/tryphotino) | Apache-2.0 | The desktop window |
          | [FactFoundry.Blazor.Charts](https://github.com/Fact-Foundry/blazor-charts) | MIT | Charts, rendered as SVG |
          | [.NET runtime](https://github.com/dotnet/runtime) | MIT | Bundled, so nothing needs installing first |

          `THIRD-PARTY-NOTICES.md` in this release lists every package including transitive ones,
          generated from the build's own dependency graph. The same file is installed to
          `/usr/share/doc/mybudget/` alongside the licence.

          WebKitGTK is not bundled; it comes from your distribution under the WebKit project's
          LGPL and BSD licences.

          Your budget lives at `~/.local/share/MyBudget/mybudget.db` and is untouched by installing
          or upgrading. Back it up from **Admin → Settings → Export budget** before a version jump.

          Verify a download against `SHA256SUMS.txt`:

          ```
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```
          NOTES
          sed -i "s/\${VERSION}/$VERSION/g" release-notes.md
          cat release-notes.md

      - name: Publish the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: MyBudget ${{ steps.v.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
          body_path: release-notes.md
